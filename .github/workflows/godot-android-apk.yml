name: Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-apk.yml"

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import and validate Godot project
        run: godot --headless --editor --path godot --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Android" build/Western-Rush-RP.apk

      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Western-Rush-RP-Android
          path: build/Western-Rush-RP.apk
          if-no-files-found: error
          retention-days: 14
